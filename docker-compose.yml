version: '3.8'

services:
  hello-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helloapp-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=HelloApp
      - SERVER_SERVLET_CONTEXT_PATH=/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

