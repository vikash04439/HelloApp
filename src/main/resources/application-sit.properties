# ============================================================
# SIT (System Integration Testing) Profile Configuration
# Activate with: --spring.profiles.active=sit
# ============================================================

# Server Port - Different from default (8080)
server.port=9090

# ============================================================
# MySQL Database Configuration (replaces H2)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/helloapp_sit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=helloapp
spring.datasource.password=helloapp123

# Disable H2 Console (not needed in SIT)
spring.h2.console.enabled=false

# JPA/Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization - disabled for SIT (ddl-auto=update handles schema)
spring.sql.init.mode=never

# ============================================================
# Logging - SIT specific path
# ============================================================
logging.file.name=logs/sit/helloapp-sit.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=60
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [SIT] %msg%n

# Reduce security debug logging in SIT
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=INFO

#Application requirement properties
applicationNode=S
gateway.log.path=logs/sit/GatewayReqRes.log

