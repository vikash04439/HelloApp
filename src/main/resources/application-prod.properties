# ============================================================
# PROD (Production) Profile Configuration - AWS EC2 deployment
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Server Port
server.port=8080

# H2 Database Configuration (file-based, persisted via Docker volume at /app/data)
spring.datasource.url=jdbc:h2:file:./data/prod/employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console disabled in production (do NOT expose the DB console on the public internet)
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always

# ============================================================
# Logging - PROD specific path
# ============================================================
logging.file.name=logs/prod/helloapp.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [PROD] %msg%n

# Reduce security debug logging in production
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web.authentication=INFO
logging.level.org.springframework.security.web.FilterChainProxy=WARN

# DevTools disabled in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Application requirement properties
applicationNode=P
gateway.log.path=logs/prod/GatewayReqRes.log
