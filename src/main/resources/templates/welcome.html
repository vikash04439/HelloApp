<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${appName} + ' · Dashboard'">Welcome Dashboard</title>
    <link rel="stylesheet" href="/css/app.css"/>
    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('helloapp-theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>

    <!-- Nav bar -->
    <nav class="navbar">
        <div class="brand">
            <span class="logo">⚡</span>
            <span th:text="${appName}">HelloApp</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="active">Dashboard</a>
            <a href="/employees">Employees</a>
        </div>
        <div class="spacer"></div>
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme">🌙</button>
    </nav>

    <!-- Header -->
    <header class="page-header">
        <h1 th:text="${appName} + ' Dashboard'">HelloApp Dashboard</h1>
        <div class="subtitle" th:text="${message}">Welcome from the App</div>
        <div class="timestamp">
            <span class="status-dot"></span>
            <span id="last-updated" th:text="'Last updated: ' + ${timestamp}">Last updated: --</span>
        </div>
    </header>

    <!-- Content -->
    <div class="container" id="dashboard" th:attr="data-start-epoch=${serverStartEpoch}">

        <!-- Memory usage bar -->
        <div class="section fade-in-up">
            <div class="section-header">
                <div class="section-icon">📊</div>
                <h3>Heap Memory Usage</h3>
            </div>
            <div style="padding: 1.25rem;">
                <div class="mem-bar-track"><div class="mem-bar-fill" id="mem-bar-fill"></div></div>
                <div class="mem-bar-label" id="mem-bar-label">Calculating…</div>
            </div>
        </div>

        <!-- Top-level scalar info cards -->
        <div class="cards-grid">
            <div class="card copyable fade-in-up" th:each="entry : ${scalarEntries}"
                 title="Click to copy">
                <div class="card-label" th:text="${entry.key}">Label</div>
                <div class="card-value" th:attr="data-key=${entry.key}">
                    <span class="value-text" th:text="${entry.value}">Value</span>
                    <span class="copy-hint">📋 copy</span>
                </div>
            </div>
        </div>

        <!-- Nested sections (dynamic) -->
        <div th:each="section : ${sectionEntries}" class="section fade-in-up">
            <div class="section-header">
                <div class="section-icon" th:text="${sectionIcons[section.key] != null ? sectionIcons[section.key] : section.key.substring(0,1).toUpperCase()}">J</div>
                <h3 th:text="${section.key}">Section</h3>
            </div>
            <div class="section-body">
                <div class="card" th:each="item : ${section.value}">
                    <div class="card-label" th:text="${item.key}">Label</div>
                    <div class="card-value" th:attr="data-key=${item.key}">
                        <span class="value-text" th:text="${item.value}">Value</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <span th:text="${appName}">HelloApp</span> &copy; 2026 &mdash; Welcome Dashboard
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
