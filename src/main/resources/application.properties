spring.application.name=Restful Hello World Application
server.port=8080
spring.profiles.active=uat

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true


# SQL Initialization
spring.sql.init.mode=always

# Logging - Console
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.authentication=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Logging - File
logging.file.name=logs/default/helloapp.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Spring Security Configuration
spring.security.user.name=partner
spring.security.user.password=partner123


